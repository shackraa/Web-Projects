name: Deploy LEAD21 Ops (public Pages)

on:
  push:
    branches: [cursor/lead21-fellow-ops-de59]
    paths:
      - "lead21-ops/**"
      - ".github/workflows/deploy-lead21-ops-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-lead21-ops
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lead21-ops/package-lock.json
      - name: Install & build
        working-directory: lead21-ops
        env:
          VITE_ROUTER: hash
        run: |
          npm ci
          npm run build -- --base=/Web-Projects/
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lead21-ops/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
